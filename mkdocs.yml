site_name: Quero.
site_url: https://felipegf1.github.io/docs-grupo3-tppe/
site_description: Quero. — plataforma de compras reversa para usados e seminovos. Documentação do projeto do Grupo 3 da disciplina de Técnicas de Programação para Plataformas Emergentes (TPPE).
site_author: Grupo 3 — TPPE
repo_url: https://github.com/felipegf1/docs-grupo3-tppe
repo_name: felipegf1/docs-grupo3-tppe

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/magnify
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      tip: octicons/light-bulb-16
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Modo Claro
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    # Modo Escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Início: index.md
  - Produto:
      - Requisitos: produto/requisitos.md
      - Glossário: produto/glossario.md
  - Histórias de Usuário:
      - Visão Geral: historias-de-usuario/index.md
      - Conta e acesso:
          - QRO-01 Cadastrar-se na plataforma: historias-de-usuario/cadastrar-se-na-plataforma.md
          - QRO-02 Autenticar-se na plataforma: historias-de-usuario/autenticar-se-na-plataforma.md
          - QRO-03 Gerenciar perfil e localização: historias-de-usuario/gerenciar-perfil-e-localizacao.md
      - Comprador:
          - QRO-04 Criar anúncio de "procura-se": historias-de-usuario/criar-anuncio-procura-se.md
          - QRO-05 Gerenciar meus anúncios: historias-de-usuario/gerenciar-meus-anuncios.md
      - Vendedor:
          - QRO-06 Ofertar produto em anúncio: historias-de-usuario/ofertar-produto-em-anuncio.md
          - QRO-07 Buscar e filtrar anúncios: historias-de-usuario/buscar-e-filtrar-anuncios.md
          - QRO-08 Cadastrar produtos na minha loja: historias-de-usuario/cadastrar-produtos-na-loja.md
      - Descoberta e recomendação:
          - QRO-09 Receber recomendações: historias-de-usuario/receber-recomendacoes.md
      - Negociação:
          - QRO-10 Palpitar preço no anúncio: historias-de-usuario/palpitar-preco-no-anuncio.md
          - QRO-11 Comparar ofertas recebidas: historias-de-usuario/comparar-ofertas-recebidas.md
          - QRO-12 Ofertar um novo valor em um anúncio: historias-de-usuario/ofertar-novo-valor.md
          - QRO-13 Responder a uma contraproposta: historias-de-usuario/responder-contraproposta.md
          - QRO-14 Negociar por chat: historias-de-usuario/negociar-por-chat.md
          - QRO-15 Aceitar ou recusar uma oferta: historias-de-usuario/aceitar-ou-recusar-oferta.md
          - QRO-16 Concluir a venda: historias-de-usuario/concluir-venda.md
      - Confiança e histórico:
          - QRO-17 Receber notificações: historias-de-usuario/receber-notificacoes.md
          - QRO-18 Avaliar a contraparte: historias-de-usuario/avaliar-contraparte.md
          - QRO-19 Consultar meu histórico de negociações: historias-de-usuario/historico-de-negociacoes.md
  - Backlog do Produto:
      - Visão Geral: backlog/index.md
      - Épico 1 — Conta e acesso: backlog/conta-e-acesso.md
      - Épico 2 — Comprador: backlog/comprador.md
      - Épico 3 — Vendedor: backlog/vendedor.md
      - Épico 4 — Descoberta e recomendação: backlog/descoberta.md
      - Épico 5 — Negociação: backlog/negociacao.md
      - Épico 6 — Confiança e histórico: backlog/confianca-e-historico.md
  - Arquitetura:
      - Visão Geral: arquitetura/index.md
      - Backend: arquitetura/backend.md
      - Geolocalização: arquitetura/geolocalizacao.md
      - Frontend: arquitetura/frontend.md
      - Infraestrutura: arquitetura/infraestrutura.md
  - Interface:
      - Identidade visual: interface/identidade-visual.md
      - Protótipo: interface/prototipo.md
  - Equipe: equipe.md

copyright: >
  Quero. — Grupo 3 · Técnicas de Programação para Plataformas Emergentes (TPPE)

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/felipegf1/docs-grupo3-tppe
      name: Repositório do Quero. no GitHub
    - icon: fontawesome/brands/github
      link: https://github.com/felipegf1
      name: felipegf1
    - icon: fontawesome/brands/github
      link: https://github.com/antonioscarvalho
      name: Antonio Carvalho
    - icon: fontawesome/brands/github
      link: https://github.com/maykonjuso
      name: maykonjuso

validation:
  anchors: warn
  unrecognized_links: warn
