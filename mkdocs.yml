site_name: Grupo 3 - TPPE
site_url: https://felipegf1.github.io/docs-grupo3-tppe/
site_description: Documentação do projeto da disciplina de Técnicas de Programação para Plataformas Emergentes (TPPE)
site_author: Grupo 3
repo_url: https://github.com/felipegf1/docs-grupo3-tppe
repo_name: felipegf1/docs-grupo3-tppe

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/swap-horizontal-bold
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      tip: octicons/light-bulb-16
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Modo Claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    # Modo Escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Início: index.md
  - Histórias de Usuário:
      - Visão Geral: historias-de-usuario/index.md
      - Conta e acesso:
          - Cadastrar-se na plataforma: historias-de-usuario/cadastrar-se-na-plataforma.md
          - Autenticar-se na plataforma: historias-de-usuario/autenticar-se-na-plataforma.md
          - Gerenciar perfil e localização: historias-de-usuario/gerenciar-perfil-e-localizacao.md
      - Comprador:
          - Criar anúncio de "procura-se": historias-de-usuario/criar-anuncio-procura-se.md
          - Gerenciar meus anúncios: historias-de-usuario/gerenciar-meus-anuncios.md
      - Vendedor:
          - Ofertar produto em anúncio: historias-de-usuario/ofertar-produto-em-anuncio.md
          - Buscar e filtrar anúncios: historias-de-usuario/buscar-e-filtrar-anuncios.md
          - Cadastrar produtos na minha loja: historias-de-usuario/cadastrar-produtos-na-loja.md
          - Divulgar minha loja: historias-de-usuario/divulgar-minha-loja.md
      - Descoberta e recomendação:
          - Receber recomendações: historias-de-usuario/receber-recomendacoes.md
          - Receber sugestões de anúncios compatíveis: historias-de-usuario/receber-sugestoes-de-anuncios.md
          - Recomendações por interesses em comum: historias-de-usuario/recomendacoes-por-interesses-em-comum.md
      - Negociação:
          - Palpitar preço no anúncio: historias-de-usuario/palpitar-preco-no-anuncio.md
          - Comparar ofertas recebidas: historias-de-usuario/comparar-ofertas-recebidas.md
          - Ofertar um novo valor em um anúncio: historias-de-usuario/ofertar-novo-valor.md
          - Responder a uma contraproposta: historias-de-usuario/responder-contraproposta.md
          - Negociar por chat: historias-de-usuario/negociar-por-chat.md
          - Aceitar ou recusar uma oferta: historias-de-usuario/aceitar-ou-recusar-oferta.md
          - Concluir a venda: historias-de-usuario/concluir-venda.md
      - Confiança e histórico:
          - Receber notificações: historias-de-usuario/receber-notificacoes.md
          - Avaliar a contraparte: historias-de-usuario/avaliar-contraparte.md
          - Consultar meu histórico de negociações: historias-de-usuario/historico-de-negociacoes.md
  - Interface:
      - Identidade visual: interface/identidade-visual.md
