name: tppe-grupo3

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tppe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tppe}
      POSTGRES_USER: ${POSTGRES_USER:-tppe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tppe}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Schema e massa de exemplo. Rodam em ordem alfabetica e APENAS quando o
      # volume db-data ainda nao existe.
      - ./db/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tppe} -d ${POSTGRES_DB:-tppe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tppe

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tppe-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tppe}:${POSTGRES_PASSWORD:-tppe}@db:5432/${POSTGRES_DB:-tppe}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tppe

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tppe-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - tppe

  adminer:
    image: adminer:latest
    container_name: tppe-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tppe

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tppe-pgadmin
    restart: unless-stopped
    # A imagem roda como uid 5050; em Podman rootless isso impede a escrita no
    # volume nomeado. Rodar como root evita o problema sem perder a persistencia.
    user: root
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@quero.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Sem isto o pgAdmin recusa o login: ".test" e um TLD reservado (RFC 6761)
      # e a validacao de e-mail o rejeita como nao entregavel.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['test', 'local']"
      # Senha do BANCO (nao a do login do pgAdmin). Sem ela o pgAdmin abre um
      # dialogo pedindo a senha a cada conexao. Um passfile nao serve aqui: o
      # processo roda como uid 5050 e nao le um arquivo montado do host, que
      # aparece como root:root — e o libpq exige modo 0600 no passfile.
      PGPASSWORD: ${POSTGRES_PASSWORD:-tppe}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Deixa a conexao com o banco ja cadastrada na arvore lateral.
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro,z
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tppe

  docs:
    image: squidfunk/mkdocs-material:9
    container_name: tppe-docs
    ports:
      - "${DOCS_PORT:-8001}:8000"
    volumes:
      - .:/docs
    networks:
      - tppe

volumes:
  db-data:
  pgadmin-data:

networks:
  tppe:
    driver: bridge
